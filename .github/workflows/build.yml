name: Build APK

# 构建中文汉化版 APK，并把产物自动发布到 Releases（滚动更新的「最新」）。
#
# - APK 文件名由 app/build.gradle.kts 决定：LyneADAS-<版本名>-zh.apk（如 LyneADAS-1.0-zh.apk）
#   因此这里不写死路径，而是构建后按 glob 自动定位，改名了也不会让工作流失败。
# - 每次 main 构建成功 → 覆盖 Releases 里的 cn-latest（固定标签，方便直接下载）
# - 每次构建同时上传 Artifacts → 便于按提交留档（默认保留 14 天）
# - PR 构建只校验能否构建，不发布
on:
  push:
    branches: [ main, l10n-cn ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 创建/更新 Release 需要写权限；PR（尤其来自 fork 时）GitHub 会自动降级为只读。
permissions:
  contents: write

env:
  APK_DIR: app/build/outputs/apk/debug
  RELEASE_TAG: cn-latest

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate and rename built APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find "$APK_DIR" -maxdepth 1 -name '*.apk' -print | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::$APK_DIR 下没有找到 .apk"
            ls -la "$APK_DIR" || true
            exit 1
          fi

          # 版本名取自 AGP 生成的元数据，保证版本仍然只有一处定义（app/build.gradle.kts）
          META="$APK_DIR/output-metadata.json"
          VERSION=""
          if [ -f "$META" ]; then
            VERSION=$(jq -r '.elements[0].versionName // empty' "$META" 2>/dev/null || true)
          fi
          # debug 构建带 versionNameSuffix="-debug"；文件名里去掉它，得到 LyneADAS-1.0-zh.apk
          VERSION="${VERSION%-debug}"

          if [ -n "$VERSION" ]; then
            TARGET="$APK_DIR/LyneADAS-${VERSION}-zh.apk"
            if [ "$APK" != "$TARGET" ]; then
              # 改名只是「让文件名好看」，失败也不该让一次成功的构建变红。
              if mv -f "$APK" "$TARGET" 2>/dev/null; then
                echo "重命名: $(basename "$APK") -> $(basename "$TARGET")"
                APK="$TARGET"
              else
                echo "::warning::重命名失败，沿用原始文件名 $(basename "$APK")"
              fi
            else
              APK="$TARGET"
            fi
          else
            echo "::warning::未能从 output-metadata.json 读到 versionName，沿用原始文件名"
          fi

          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -le 0 ]; then
            echo "::error::APK 为空: $APK"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "产物: $APK ($((SIZE / 1024 / 1024)) MB)"

      - name: Upload APK as build artifact (按提交留档)
        uses: actions/upload-artifact@v6
        with:
          name: lyne-adas-cn-debug
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to Releases (滚动最新)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_FILE: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "$APK_FILE")
          {
            echo "## Lyne ADAS 中文版"
            echo
            echo "由 GitHub Actions 自动构建并发布。"
            echo
            echo "- 文件: ${APK_NAME}"
            echo "- 提交: ${GITHUB_SHA}"
            echo "- 分支: ${GITHUB_REF_NAME}"
            echo "- APK 大小: $((SIZE / 1024 / 1024)) MB"
            echo "- 构建记录: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "> 标签 ${RELEASE_TAG} 是滚动更新的「最新中文构建」，每次 main 构建成功都会覆盖这里的 APK。"
            echo "> 需要按提交固定留档的版本，请到对应工作流运行的 Artifacts 中下载。"
            echo
            echo "### 安装与安全提示"
            echo "- 本应用仅提供警告，不会控制车辆；请把手机横向固定在挡风玻璃上"
            echo "- 请始终保持对道路的注意力，本应用不能替代驾驶判断"
          } > notes.md

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "更新已有 Release: $RELEASE_TAG"
            # 先清掉不再匹配当前文件名的旧附件（例如早期版本留下的 app-debug.apk），
            # 避免 Release 里堆积过期 APK。失败不阻断流程。
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | while read -r asset; do
                [ -z "$asset" ] && continue
                if [ "$asset" != "$APK_NAME" ]; then
                  echo "移除过期附件: $asset"
                  gh release delete-asset "$RELEASE_TAG" "$asset" \
                    --repo "$GITHUB_REPOSITORY" --yes || true
                fi
              done
            gh release upload "$RELEASE_TAG" "$APK_FILE" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            echo "创建 Release: $RELEASE_TAG"
            gh release create "$RELEASE_TAG" "$APK_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Lyne ADAS 中文版（最新构建）" \
              --notes-file notes.md \
              --prerelease
          fi
          echo "Release 已更新: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
